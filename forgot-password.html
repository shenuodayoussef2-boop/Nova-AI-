
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>استعادة كلمة المرور - Nova AI</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #102b3d, #071018 55%, #04080c);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: rgba(12, 20, 28, 0.96);
            border: 1px solid rgba(0, 255, 255, 0.15);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #00e5ff, #007cff);
            color: #041018;
            font-size: 32px;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #91a3b2;
            line-height: 1.8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #dce7ee;
            font-size: 14px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6f8594;
        }

        input {
            width: 100%;
            padding: 14px 44px 14px 14px;
            border-radius: 14px;
            border: 1px solid #243746;
            background: #0b151e;
            color: white;
            outline: none;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #00d9ff;
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.08);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #031016;
            background: linear-gradient(135deg, #00e5ff, #00a8ff);
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.8;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(40, 220, 150, 0.1);
            border: 1px solid rgba(40, 220, 150, 0.2);
            color: #9ff0ca;
        }

        .message.error {
            background: rgba(255, 70, 70, 0.1);
            border: 1px solid rgba(255, 70, 70, 0.2);
            color: #ffaaaa;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #00d9ff;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <main class="container">
        <section class="card">

            <div class="logo">
                <i class="fa-solid fa-key"></i>
            </div>

            <h1>نسيت كلمة المرور؟</h1>

            <p class="subtitle">
                متقلقش! اكتب بريدك الإلكتروني وهتوصلك رسالة
                فيها رابط لإنشاء كلمة مرور جديدة.
            </p>

            <form id="forgotPasswordForm">

                <label for="email">البريد الإلكتروني</label>

                <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" id="sendResetBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                    إرسال رابط الاستعادة
                </button>

            </form>

            <div id="message" class="message"></div>

            <a href="login.html" class="back">
                <i class="fa-solid fa-arrow-right"></i>
                العودة إلى تسجيل الدخول
            </a>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const sendBtn = document.getElementById("sendResetBtn");
        const messageBox = document.getElementById("message");

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = "message show " + type;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const supabase = window.novaSupabase;

            if (!supabase) {
                showMessage("حصلت مشكلة في الاتصال بـ Nova AI.", "error");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال الرابط...';

            try {
                const { error } =
                    await supabase.auth.resetPasswordForEmail(email, {
                        redirectTo:
                            window.location.origin + "/reset-password.html"
                    });

                if (error) throw error;

                showMessage(
                    "لو البريد مسجل عندنا، هتوصلك رسالة لاستعادة كلمة المرور. راجع صندوق الوارد والـ Spam.",
                    "success"
                );

            } catch (error) {
                console.error("NOVA RESET PASSWORD ERROR:", error);

                showMessage(
                    "حصلت مشكلة أثناء إرسال الرابط. حاول مرة تانية.",
                    "error"
                );

            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML =
                    '<i class="fa-solid fa-paper-plane"></i> إرسال رابط الاستعادة';
            }
        });
    </script>

</body>
</html>
