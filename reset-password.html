
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <title>استعادة كلمة المرور | Nova AI</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: #111c30;
            border: 1px solid #26364f;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            color: #22d3ee;
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 23px;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #a9b8cc;
            text-align: center;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0b1220;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #22d3ee;
            color: #08202b;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 9px;
            line-height: 1.7;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #123629;
            color: #86efac;
        }

        .message.error {
            background: #401d29;
            color: #fda4af;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #67e8f9;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <main class="reset-card">

        <div class="logo">Nova AI</div>

        <h1>استعادة كلمة المرور 🔐</h1>

        <p class="description">
            اكتب البريد الإلكتروني المرتبط بحسابك،
            وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.
        </p>

        <form id="resetForm">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
            >

            <button type="submit" id="resetBtn">
                إرسال رابط الاستعادة
            </button>

        </form>

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>

        <a class="back-link" href="login.html">
            <i>←</i>
            العودة إلى تسجيل الدخول
        </a>

    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Nova Supabase -->
    <script src="supabase.js"></script>

    <!-- Reset Password Logic -->
    <script src="reset-password.js"></script>

</body>
</html>
