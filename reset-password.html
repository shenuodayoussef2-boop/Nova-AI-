
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <title>تعيين كلمة مرور جديدة | Nova AI</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #102b3d, #071018 55%, #04080c);
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: rgba(12, 20, 28, .96);
            border: 1px solid rgba(0, 217, 255, .17);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #00e5ff, #007cff);
            color: #041018;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 12px;
        }

        .description {
            color: #91a3b2;
            text-align: center;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #0b151e;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus { border-color: #00d9ff; }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #00e5ff, #00a8ff);
            color: #031016;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: .6; cursor: not-allowed; }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.8;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .message.show { display: block; }
        .message.success { background: #123629; color: #86efac; }
        .message.error { background: #401d29; color: #fda4af; }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #67e8f9;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover { color: white; }

        [hidden] { display: none !important; }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>كلمة مرور جديدة</h1>

        <p class="description">
            أنشئ كلمة مرور جديدة لحسابك في Nova AI.
        </p>

        <div id="checkingMessage" class="message show">
            جاري التحقق من رابط الاستعادة...
        </div>

        <form id="resetForm" hidden>
            <label for="newPassword">كلمة المرور الجديدة</label>

            <input
                type="password"
                id="newPassword"
                placeholder="اكتب كلمة المرور الجديدة"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">تأكيد كلمة المرور</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="saveBtn">
                <i class="fa-solid fa-lock"></i>
                حفظ كلمة المرور الجديدة
            </button>
        </form>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <a href="login.html" class="back">
            <i class="fa-solid fa-arrow-right"></i>
            العودة إلى تسجيل الدخول
        </a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const supabase = window.novaSupabase;

        const resetForm = document.getElementById("resetForm");
        const checkingMessage = document.getElementById("checkingMessage");
        const messageBox = document.getElementById("message");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const saveBtn = document.getElementById("saveBtn");

        let recoveryReady = false;

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = "message show " + type;
        }

        function enableResetForm() {
            recoveryReady = true;
            checkingMessage.hidden = true;
            resetForm.hidden = false;
        }

        function rejectRecovery() {
            recoveryReady = false;
            checkingMessage.hidden = true;
            resetForm.hidden = true;

            showMessage(
                "رابط الاستعادة غير صالح أو انتهت صلاحيته. ارجع لصفحة نسيت كلمة المرور واطلب رابطاً جديداً.",
                "error"
            );
        }

        async function checkRecoverySession() {
            if (!supabase) {
                rejectRecovery();
                return;
            }

            try {
                const { data, error } = await supabase.auth.getSession();

                if (error) throw error;

                if (data.session) {
                    enableResetForm();
                } else {
                    rejectRecovery();
                }
            } catch (error) {
                console.error("NOVA RECOVERY SESSION ERROR:", error);
                rejectRecovery();
            }
        }

        if (supabase) {
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === "PASSWORD_RECOVERY" && session) {
                    enableResetForm();
                }
            });

            checkRecoverySession();
        } else {
            rejectRecovery();
        }

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!recoveryReady) {
                rejectRecovery();
                return;
            }

            const password = newPassword.value;
            const confirmation = confirmPassword.value;

            if (password.length < 8) {
                showMessage(
                    "كلمة المرور لازم تكون 8 أحرف على الأقل.",
                    "error"
                );
                return;
            }

            if (password !== confirmation) {
                showMessage(
                    "كلمتا المرور غير متطابقتين.",
                    "error"
                );
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "جاري حفظ كلمة المرور...";

            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                resetForm.hidden = true;

                showMessage(
                    "تم تغيير كلمة المرور بنجاح! تقدر دلوقتي تستخدم كلمة المرور الجديدة.",
                    "success"
                );

            } catch (error) {
                console.error("NOVA UPDATE PASSWORD ERROR:", error);

                showMessage(
                    "لم نتمكن من تغيير كلمة المرور. تأكد من صلاحية رابط الاستعادة وحاول مرة أخرى.",
                    "error"
                );

            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML =
                    '<i class="fa-solid fa-lock"></i> حفظ كلمة المرور الجديدة';
            }
        });
    </script>
</body>
</html>
