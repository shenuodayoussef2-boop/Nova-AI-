<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - Nova AI</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.22), transparent 35%),
                radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.18), transparent 35%),
                #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo h1 span {
            color: #6366f1;
        }

        .logo p {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 14px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(15px);
        }

        .login-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-title h2 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .login-title p {
            color: #94a3b8;
            font-size: 14px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .social-btn {
            height: 48px;
            border: 1px solid #475569;
            border-radius: 11px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            background: #334155;
        }

        .google-icon {
            color: #ea4335;
            font-size: 18px;
        }

        .facebook-icon {
            color: #1877f2;
            font-size: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #64748b;
            font-size: 13px;
            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            border: 1px solid #475569;
            border-radius: 11px;
            background: #0f172a;
            color: #f8fafc;
            outline: none;
            padding: 0 45px 0 45px;
            font-size: 15px;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .password-toggle {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
        }

        .password-toggle:hover {
            color: #a5b4fc;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 5px 0 20px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #94a3b8;
            cursor: pointer;
        }

        .remember input {
            accent-color: #6366f1;
        }

        .forgot-password {
            color: #818cf8;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .register-link {
            text-align: center;
            margin-top: 23px;
            color: #94a3b8;
            font-size: 14px;
        }

        .register-link a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .login-card {
                padding: 23px 18px;
                border-radius: 18px;
            }

            .logo h1 {
                font-size: 28px;
            }

            .social-buttons {
                grid-template-columns: 1fr;
            }

            .form-options {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="logo">
        <h1>Nova <span>AI</span></h1>
        <p>استوديو الذكاء الاصطناعي</p>
    </div>

    <div class="login-card">

        <div class="login-title">
            <h2>مرحبًا بعودتك 👋</h2>
            <p>سجل الدخول إلى حسابك في Nova AI</p>
        </div>

        <!-- Google & Facebook -->
        <div class="social-buttons">

            <button type="button"
                    class="social-btn"
                    id="googleLoginBtn">
                <i class="fa-brands fa-google google-icon"></i>
                <span>Google</span>
            </button>

            <button type="button"
                    class="social-btn"
                    id="facebookLoginBtn">
                <i class="fa-brands fa-facebook-f facebook-icon"></i>
                <span>Facebook</span>
            </button>

        </div>

        <div class="divider">
            <span>أو سجل باستخدام البريد الإلكتروني</span>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>

                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>

                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="إظهار كلمة المرور">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">

                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    <span>تذكرني</span>
                </label>

                <a href="#" class="forgot-password">
                    نسيت كلمة المرور؟
                </a>

            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                تسجيل الدخول
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="register-link">
            ليس لديك حساب؟
            <a href="register.html">إنشاء حساب جديد</a>
        </div>

    </div>

    <a href="index.html" class="back-home">
        <i class="fa-solid fa-arrow-right"></i>
        العودة إلى Nova AI
    </a>

</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");
    const message = document.getElementById("message");

    // إظهار / إخفاء كلمة المرور
    passwordToggle.addEventListener("click", () => {
        const icon = passwordToggle.querySelector("i");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.className = "fa-regular fa-eye-slash";
        } else {
            passwordInput.type = "password";
            icon.className = "fa-regular fa-eye";
        }
    });

    function showMessage(text, type = "error") {
        message.textContent = text;
        message.className = "message " + type;
    }

    // تسجيل الدخول بالبريد وكلمة المرور
    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;
        const rememberMe = document.getElementById("rememberMe").checked;

        if (!email || !password) {
            showMessage("من فضلك أدخل البريد الإلكتروني وكلمة المرور.");
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "جاري تسجيل الدخول...";

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password,
                    rememberMe
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "بيانات تسجيل الدخول غير صحيحة."
                );
            }

            showMessage("تم تسجيل الدخول بنجاح ✓", "success");

            setTimeout(() => {
                window.location.href = "index.html";
            }, 700);

        } catch (error) {
            console.error(error);
            showMessage(
                error.message || "حدث خطأ أثناء تسجيل الدخول."
            );

        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = "تسجيل الدخول";
        }
    });

    // Google
    document.getElementById("googleLoginBtn").addEventListener("click", () => {
        /*
         * سيتم ربط Google OAuth هنا.
         * لا نضع Client Secret داخل JavaScript.
         */
        window.location.href = "/api/auth/google";
    });

    // Facebook
    document.getElementById("facebookLoginBtn").addEventListener("click", () => {
        /*
         * سيتم ربط Facebook OAuth هنا.
         * لا نضع App Secret داخل JavaScript.
         */
        window.location.href = "/api/auth/facebook";
    });
</script>

</body>
</html>
